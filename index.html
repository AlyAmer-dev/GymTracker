<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>90 Days Gym Challenge</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 30px;
        padding: 40px;
        max-width: 900px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }

      .header {
        text-align: center;
        margin-bottom: 40px;
      }

      .header h1 {
        color: #667eea;
        font-size: 2.5em;
        margin-bottom: 10px;
        font-weight: 700;
      }

      .header p {
        color: #666;
        font-size: 1.1em;
      }

      .progress-section {
        margin-bottom: 50px;
      }

      .progress-info {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }

      .progress-percentage {
        font-size: 2.5em;
        font-weight: 700;
        color: #667eea;
      }

      .progress-days {
        font-size: 1.2em;
        color: #666;
      }

      .progress-bar-container {
        background: #e0e0e0;
        height: 30px;
        border-radius: 15px;
        overflow: hidden;
        position: relative;
      }

      .progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        border-radius: 15px;
        transition: width 0.5s ease;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding-right: 15px;
      }

      .days-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
        gap: 15px;
        margin-top: 30px;
      }

      .day-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .day-checkbox {
        width: 50px;
        height: 50px;
        border: 3px solid #667eea;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        background: white;
        position: relative;
      }

      .day-checkbox:hover {
        transform: scale(1.1);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
      }

      .day-checkbox.checked {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-color: #764ba2;
      }

      .day-checkbox.checked::after {
        content: "✓";
        color: white;
        font-size: 24px;
        font-weight: bold;
      }

      .day-label {
        font-size: 0.9em;
        color: #666;
        font-weight: 600;
      }

      .buttons-container {
        display: flex;
        gap: 20px;
        justify-content: center;
        margin-top: 30px;
        flex-wrap: wrap;
      }

      .reset-button,
      .diet-button {
        color: white;
        border: none;
        padding: 15px 40px;
        border-radius: 25px;
        font-size: 1.1em;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
      }

      .reset-button {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        box-shadow: 0 5px 15px rgba(245, 87, 108, 0.3);
      }

      .reset-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(245, 87, 108, 0.4);
      }

      .diet-button {
        background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        box-shadow: 0 5px 15px rgba(56, 239, 125, 0.3);
      }

      .diet-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(56, 239, 125, 0.4);
      }

      .stats {
        display: flex;
        justify-content: space-around;
        margin-top: 30px;
        padding-top: 30px;
        border-top: 2px solid #e0e0e0;
      }

      .stat-item {
        text-align: center;
      }

      .stat-number {
        font-size: 2em;
        font-weight: 700;
        color: #667eea;
      }

      .stat-label {
        color: #666;
        margin-top: 5px;
      }

      @media (max-width: 600px) {
        .container {
          padding: 20px;
        }

        .header h1 {
          font-size: 1.8em;
        }

        .days-grid {
          grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
          gap: 10px;
        }

        .day-checkbox {
          width: 40px;
          height: 40px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🏋️ تحدي الـ90 يوم 🏋️</h1>
        <p>حقق هدفك خطوة بخطوة</p>
      </div>

      <div class="progress-section">
        <div class="progress-info">
          <div class="progress-percentage" id="percentage">0%</div>
          <div class="progress-days">
            <span id="completedDays">0</span> / 90 يوم
          </div>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>

      <div class="days-grid" id="daysGrid"></div>

      <div class="stats">
        <div class="stat-item">
          <div class="stat-number" id="remainingDays">90</div>
          <div class="stat-label">يوم متبقي</div>
        </div>
        <div class="stat-item">
          <div class="stat-number" id="streak">0</div>
          <div class="stat-label">أطول سلسلة</div>
        </div>
      </div>

      <div class="buttons-container">
        <a href="DietPlan/y.htm" class="diet-button">🥗 النظام الغذائي</a>
        <button class="reset-button" onclick="resetChallenge()">
          إعادة التحدي
        </button>
      </div>
    </div>

    <script>
      const totalDays = 90;
      let checkedDays = {};
      let audioContext = null;

      // تهيئة الصوت عند أول تفاعل
      function initAudio() {
        if (!audioContext) {
          audioContext = new (window.AudioContext ||
            window.webkitAudioContext)();
        }
        if (audioContext.state === "suspended") {
          audioContext.resume();
        }
      }

      function playSuccessSound() {
        if (!audioContext) return;

        try {
          const oscillator = audioContext.createOscillator();
          const gainNode = audioContext.createGain();

          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);

          oscillator.frequency.value = 800;
          oscillator.type = "sine";

          gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(
            0.01,
            audioContext.currentTime + 0.2
          );

          oscillator.start(audioContext.currentTime);
          oscillator.stop(audioContext.currentTime + 0.2);

          // نغمة ثانية
          setTimeout(() => {
            const osc2 = audioContext.createOscillator();
            const gain2 = audioContext.createGain();

            osc2.connect(gain2);
            gain2.connect(audioContext.destination);

            osc2.frequency.value = 1000;
            osc2.type = "sine";

            gain2.gain.setValueAtTime(0.2, audioContext.currentTime);
            gain2.gain.exponentialRampToValueAtTime(
              0.01,
              audioContext.currentTime + 0.15
            );

            osc2.start(audioContext.currentTime);
            osc2.stop(audioContext.currentTime + 0.15);
          }, 50);
        } catch (e) {
          console.log("خطأ في تشغيل الصوت");
        }
      }

      function playUncheckSound() {
        if (!audioContext) return;

        try {
          const oscillator = audioContext.createOscillator();
          const gainNode = audioContext.createGain();

          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);

          oscillator.frequency.value = 400;
          oscillator.type = "sine";

          gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(
            0.01,
            audioContext.currentTime + 0.1
          );

          oscillator.start(audioContext.currentTime);
          oscillator.stop(audioContext.currentTime + 0.1);
        } catch (e) {
          console.log("خطأ في تشغيل الصوت");
        }
      }

      // تحميل البيانات المحفوظة
      function loadProgress() {
        const saved = JSON.parse(localStorage.getItem("gymChallenge") || "{}");
        checkedDays = saved;
        updateProgress();
      }

      // حفظ البيانات
      function saveProgress() {
        localStorage.setItem("gymChallenge", JSON.stringify(checkedDays));
      }

      // إنشاء الأيام
      function createDays() {
        const grid = document.getElementById("daysGrid");
        grid.innerHTML = "";

        for (let i = 1; i <= totalDays; i++) {
          const dayItem = document.createElement("div");
          dayItem.className = "day-item";

          const checkbox = document.createElement("div");
          checkbox.className = "day-checkbox";
          checkbox.id = `day-${i}`;
          if (checkedDays[i]) {
            checkbox.classList.add("checked");
          }

          checkbox.onclick = () => toggleDay(i);

          const label = document.createElement("div");
          label.className = "day-label";
          label.textContent = `${i}`;

          dayItem.appendChild(checkbox);
          dayItem.appendChild(label);
          grid.appendChild(dayItem);
        }
      }

      // تبديل حالة اليوم
      function toggleDay(day) {
        initAudio(); // تهيئة الصوت عند أول ضغطة

        const checkbox = document.getElementById(`day-${day}`);

        if (checkedDays[day]) {
          delete checkedDays[day];
          checkbox.classList.remove("checked");
          playUncheckSound();
        } else {
          checkedDays[day] = true;
          checkbox.classList.add("checked");
          playSuccessSound();
        }

        saveProgress();
        updateProgress();
      }

      // تحديث شريط التقدم
      function updateProgress() {
        const completed = Object.keys(checkedDays).length;
        const percentage = Math.round((completed / totalDays) * 100);

        document.getElementById("percentage").textContent = `${percentage}%`;
        document.getElementById("completedDays").textContent = completed;
        document.getElementById("remainingDays").textContent =
          totalDays - completed;
        document.getElementById("progressBar").style.width = `${percentage}%`;

        // حساب أطول سلسلة
        const streak = calculateStreak();
        document.getElementById("streak").textContent = streak;
      }

      // حساب أطول سلسلة متتالية
      function calculateStreak() {
        let maxStreak = 0;
        let currentStreak = 0;

        for (let i = 1; i <= totalDays; i++) {
          if (checkedDays[i]) {
            currentStreak++;
            maxStreak = Math.max(maxStreak, currentStreak);
          } else {
            currentStreak = 0;
          }
        }

        return maxStreak;
      }

      // إعادة التحدي
      function resetChallenge() {
        if (confirm("هل أنت متأكد من إعادة التحدي؟ سيتم حذف جميع البيانات!")) {
          checkedDays = {};
          localStorage.removeItem("gymChallenge");
          createDays();
          updateProgress();
        }
      }

      // تهيئة التطبيق
      loadProgress();
      createDays();
    </script>
  </body>
</html>
